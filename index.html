<p>芝加哥（Chicago）隶属于美国伊利诺伊州库克县，位于密歇根湖南岸，是美国第三大城市、世界金融中心之一，也是北美五大湖区城市群的核心城市。<br>城市中心坐标北纬 41°39′、西经 87°34′，被誉为“摩天大楼的故乡”，拥有美国最大的商业中心区与期货市场之一，是美国发展最均衡的经济体。<br>芝加哥河起源于密歇根湖，经运河向南汇入密西西比河水系。</p>
